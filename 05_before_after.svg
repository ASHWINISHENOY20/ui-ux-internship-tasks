</defs>
<rect width="1440" height="1024" fill="#F5F8FC"/>
<text x="80" y="85" font-family="Arial" font-size="48" font-weight="800" fill="#102A56">Before → After</text>
<text x="80" y="128" font-family="Arial" font-size="21" fill="#66758C">How the redesign improves scanning, navigation and admissions access</text>
<rect x="80" y="195" width="590" height="690" rx="26" fill="white" stroke="#E1E7F0"/>
<text x="120" y="250" font-family="Arial" font-size="27" font-weight="800" fill="#64748B">BEFORE</text>
<rect x="120" y="285" width="510" height="65" fill="#E9EDF2"/><text x="145" y="325" font-family="Arial" font-size="17" fill="#64748B">Many links compete for attention</text>
<rect x="120" y="375" width="510" height="145" fill="#DDE2E8"/><text x="145" y="455" font-family="Arial" font-size="19" fill="#64748B">Long / dense information blocks</text>
<rect x="120" y="545" width="245" height="120" fill="#E9EDF2"/><rect x="385" y="545" width="245" height="120" fill="#E9EDF2"/>
<text x="120" y="735" font-family="Arial" font-size="17" fill="#64748B">• Harder to scan</text><text x="120" y="770" font-family="Arial" font-size="17" fill="#64748B">• Admissions less prominent</text><text x="120" y="805" font-family="Arial" font-size="17" fill="#64748B">• Dense on mobile</text>
<rect x="770" y="195" width="590" height="690" rx="26" fill="white" stroke="#CDE7D9"/>
<text x="810" y="250" font-family="Arial" font-size="27" font-weight="800" fill="#19A974">AFTER</text>
<rect x="810" y="285" width="510" height="65" fill="#EAF2FF"/><text x="835" y="325" font-family="Arial" font-size="17" fill="#334155">Simple navigation + visible Apply Now</text>
<rect x="810" y="375" width="510" height="145" rx="16" fill="#0B2E6F"/><text x="835" y="440" font-family="Arial" font-size="23" font-weight="800" fill="white">Clear hero + campus photo</text>
<rect x="810" y="545" width="155" height="120" rx="16" fill="#F7F9FC"/><rect x="985" y="545" width="155" height="120" rx="16" fill="#F7F9FC"/><rect x="1160" y="545" width="160" height="120" rx="16" fill="#F7F9FC"/>
<text x="810" y="735" font-family="Arial" font-size="17" fill="#334155">✓ Clear visual hierarchy</text><text x="810" y="770" font-family="Arial" font-size="17" fill="#334155">✓ Programme cards</text><text x="810" y="805" font-family="Arial" font-size="17" fill="#334155">✓ Responsive mobile layout</text></svg>