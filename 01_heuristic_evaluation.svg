<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="1440" height="1024" viewBox="0 0 1440 1024">
<defs>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2E6F"/><stop offset="1" stop-color="#1D62C8"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".13"/></filter>
 <clipPath id="heroClip"><rect x="80" y="155" width="1280" height="390" rx="28"/></clipPath>
</defs>
<rect width="1440" height="1024" fill="#F5F8FC"/>
<text x="80" y="85" font-family="Arial" font-size="48" font-weight="800" fill="#102A56">CEC Website Redesign</text>
<text x="80" y="128" font-family="Arial" font-size="21" fill="#66758C">Heuristic evaluation • redesigned around clarity, admissions and mobile usability</text><rect x="80" y="205" width="1280" height="120" rx="20" fill="white" filter="url(#shadow)"/>
<circle cx="125" cy="265" r="28" fill="#E8F0FF"/><text x="125" y="272" text-anchor="middle" font-family="Arial" font-size="17" font-weight="800" fill="#1D62C8">1</text>
<text x="175" y="253" font-family="Arial" font-size="23" font-weight="800" fill="#102A56">Navigation</text>
<text x="175" y="287" font-family="Arial" font-size="18" fill="#53657D">Reduce competing links into Home, About, Academics, Admissions, Campus and Contact.</text><rect x="80" y="350" width="1280" height="120" rx="20" fill="white" filter="url(#shadow)"/>
<circle cx="125" cy="410" r="28" fill="#E8F0FF"/><text x="125" y="417" text-anchor="middle" font-family="Arial" font-size="17" font-weight="800" fill="#1D62C8">2</text>
<text x="175" y="398" font-family="Arial" font-size="23" font-weight="800" fill="#102A56">Information hierarchy</text>
<text x="175" y="432" font-family="Arial" font-size="18" fill="#53657D">Turn dense text into short sections, cards and clear headings.</text><rect x="80" y="495" width="1280" height="120" rx="20" fill="white" filter="url(#shadow)"/>
<circle cx="125" cy="555" r="28" fill="#E8F0FF"/><text x="125" y="562" text-anchor="middle" font-family="Arial" font-size="17" font-weight="800" fill="#1D62C8">3</text>
<text x="175" y="543" font-family="Arial" font-size="23" font-weight="800" fill="#102A56">Admissions</text>
<text x="175" y="577" font-family="Arial" font-size="18" fill="#53657D">Keep “Apply Now” visible in the header and repeat it near the bottom.</text><rect x="80" y="640" width="1280" height="120" rx="20" fill="white" filter="url(#shadow)"/>
<circle cx="125" cy="700" r="28" fill="#E8F0FF"/><text x="125" y="707" text-anchor="middle" font-family="Arial" font-size="17" font-weight="800" fill="#1D62C8">4</text>
<text x="175" y="688" font-family="Arial" font-size="23" font-weight="800" fill="#102A56">Programs</text>
<text x="175" y="722" font-family="Arial" font-size="18" fill="#53657D">Present CEC’s seven BE programmes as scannable cards.</text><rect x="80" y="785" width="1280" height="120" rx="20" fill="white" filter="url(#shadow)"/>
<circle cx="125" cy="845" r="28" fill="#E8F0FF"/><text x="125" y="852" text-anchor="middle" font-family="Arial" font-size="17" font-weight="800" fill="#1D62C8">5</text>
<text x="175" y="833" font-family="Arial" font-size="23" font-weight="800" fill="#102A56">Mobile</text>
<text x="175" y="867" font-family="Arial" font-size="18" fill="#53657D">Stack content vertically and replace the desktop menu with a compact menu icon.</text></svg>